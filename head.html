<script>
  window.addEventListener('load', function() {
    setTimeout(function() {
      var s = document.createElement('script');
      s.src = '/scripts/abbv-plugins.js';
      document.body.appendChild(s);
    }, 1000);
  });
</script>
<link rel="stylesheet" href="/styles/styles.css"/>
<!-- Per-brand bundle (tokens + that brand's global/site CSS). Defaults to
     linzess; scripts.js swaps this to /styles/brands/<brand>/styles.css based on
     the page's <meta name="brand"> so each brand loads ONLY its own stylesheet
     and never inherits another brand's global CSS. -->
<link rel="stylesheet" href="/styles/brands/linzess/styles.css" data-brand-tokens/>
